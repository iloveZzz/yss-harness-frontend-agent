        type: context-conditional,
        when: lifecycle-document-output
      }
  yss-implementation-contract-compiler:
    - {
        skill: i-have-adhd,
        type: context-conditional,
        when: lifecycle-document-output
      }
  yss-openapi-governance:
    - {
        skill: i-have-adhd,
        type: context-conditional,
        when: lifecycle-document-output

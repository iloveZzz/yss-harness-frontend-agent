        when: lifecycle-document-output
      }
  harness-orchestrator:
    - {
        skill: i-have-adhd,
        type: context-conditional,
        when: lifecycle-document-output
      }
  yss-ui-business-page-generation:
    - skill: yss-components
      type: context-conditional
      when: components
    - skill: yss-hook
      type: context-conditional
      when: hooks
    - skill: yss-formily
      type: context-conditional
      when: form
    - skill: yss-api-integration
      type: context-conditional
      when: api
  yss-api-integration:
    - skill: yss-openapi-governance
      type: context-conditional
      when: regeneration
invocation_contract:
  schema_version: 2
  scope: discovery-only
  required_fields:
    - invocation_mode
    - trigger_conditions
    - exclusion_conditions
    - primary_output
  allowed_invocation_modes:
    - user
    - model
    - both
  trigger_source: impacts
  trigger_encoding: impact:<impact>
  default:
    invocation_mode: model
    trigger_conditions:
      - registered-skill-request
    exclusion_conditions:
      - no-trigger-match
    primary_output: skill-guidance
  layer_defaults:
    core:
      invocation_mode: both
      primary_output: workflow-result
    specialist:
      invocation_mode: model
      primary_output: implementation-guidance
    compatibility:
      invocation_mode: user
      primary_output: explicit-user-compatibility-input
    maintainer-only:
      invocation_mode: user
      primary_output: maintenance-operation
  overrides:
    i-have-adhd:
      invocation_mode: model
      trigger_conditions: [ lifecycle-document-output ]
      exclusion_conditions: [ code-only-work, command-only-work, unrelated-conversation, user-disabled ]
      primary_output: document-writing-assistance

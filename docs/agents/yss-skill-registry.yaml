schema_version: 2
registry_id: yss.skill-routing
status: active
description: 技能身份、capability、任务模式、类型化依赖、分层、别名和默认可发现性的 单一可执行注册表。实现合同编译器与 Harness
  编排器只消费通过本表校验的 canonical 技能；skills-lock.json 继续独立持有来源、hash 与投影完整性。
canonical_content_root: .agents/skills
architecture_profiles: {}
runtime_policy:
  consumed_by_compiler: true
  consumed_by_lifecycle: true
  discovery_enforced: true
capability_contract:
  schema_version: 2
  id_pattern: ^[a-z][a-z0-9-]*(?:\.[a-z][a-z0-9-]*)+$
  dependency_types:
    - context-required
    - context-conditional
    - coordination-only
    - review-only
    - component-dependency
  task_modes:
    - guidance
    - integration
    - slice-implementation
    - troubleshooting
    - component-maintenance
    - review-input
    - contract-compilation
    - reroute
    - result-validation
    - source-index-refresh
  closure:
    recursive_types:
      - context-required
    conditional_type: context-conditional
    non_expanding_types:
      - coordination-only
      - review-only
      - component-dependency
    deduplicate_skills: true
    preserve_all_reasons: true
  deterministic_order:
    - recipe-declaration
    - dependency-topology
    - skill-id
capabilities:
  - {
      id: writing.lifecycle-document,
      primary_skill: i-have-adhd,
      task_modes: [ guidance ]
    }
  - id: execution.frontend-slice
    primary_skill: frontend-agent
    task_modes:
      - slice-implementation
      - result-validation
  - id: frontend.ui
    primary_skill: yss-ui
    task_modes:
      - integration
      - slice-implementation
      - review-input
  - id: frontend.api-integration
    primary_skill: yss-api-integration
    task_modes:
      - integration
      - slice-implementation
  - id: governance.implementation-contract
    primary_skill: yss-implementation-contract-compiler
    task_modes:
      - contract-compilation
      - reroute
      - result-validation
  - id: architecture.system-data
    primary_skill: architecture-agent
    task_modes:
      - guidance
      - contract-compilation
      - review-input
  - id: maintenance.skill-source-index
    primary_skill: yss-skill-source-index-refresh
    task_modes:
      - component-maintenance
      - source-index-refresh
recipes:
  - id: frontend.ui-slice
    capabilities:
      - execution.frontend-slice
      - frontend.ui
      - governance.implementation-contract
skill_dependencies:
  test-agent:
    - {
        skill: i-have-adhd,
        type: context-conditional,
        when: lifecycle-document-output
      }
  frontend-agent:
    - {
        skill: i-have-adhd,
        type: context-conditional,
        when: lifecycle-document-output
      }
  architecture-agent:
    - {
